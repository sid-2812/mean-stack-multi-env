events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /api/healthcheck {
            proxy_pass http://backend:5300/healthcheck;
        }

        location /api/ {
            proxy_pass http://backend:5300/;
        }
    }
}